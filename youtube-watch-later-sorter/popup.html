<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 270px;
      padding: 15px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #202020;
      color: white;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #cc0000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #ff0000;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      min-height: 20px;
      overflow-wrap: anywhere;
    }
    .hint {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    #plan {
      margin-top: 12px;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ddd;
      font-size: 12px;
      line-height: 1.35;
      min-height: 34px;
    }
  </style>
</head>
<body>
  <h2>WL Sorter</h2>
  <div class="hint">
    Open Watch Later, scroll until every video is loaded, then sort.
    Works with English and German YouTube menu labels.
  </div>
  <button id="sortBtn">Strict Sort (All) &uarr;</button>
  <button id="smartSortBtn">Smart Sort (New Only) &uarr;</button>
  <div id="plan">Plan: open Watch Later to analyze moves.</div>
  <div id="status">Ready</div>
  <script src="popup.js"></script>
</body>
</html>
